<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map PDF Boxes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #canvas-container { position: relative; border: 1px solid #000; display: inline-block; cursor: crosshair; }
    canvas { display: block; }
    #log { margin-top: 10px; width: 100%; height: 200px; }
  </style>
</head>
<body>
  <h1>Map PDF Boxes</h1>
  <p>Click top-left then bottom-right of a cell to get its PDF coordinates.</p>
  <div id="canvas-container">
    <canvas id="pdf-canvas"></canvas>
  </div>
  <textarea id="log"></textarea>
  <script>
    const url = '../sources/templates/PLANTILLAS_PDF_IMPRIMIR/PDF_INDIVIDUALES/01_NOMINA_DE_MATRICULA.pdf';
    
    let pdfDoc = null;
    let pageNum = 1;
    let canvas = document.getElementById('pdf-canvas');
    let ctx = canvas.getContext('2d');
    let scale = 2.0; // Render at 2x scale
    let viewport = null;

    pdfjsLib.getDocument(url).promise.then(pdf => {
      pdfDoc = pdf;
      pdf.getPage(pageNum).then(page => {
        viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        let renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        page.render(renderContext);
      });
    });

    let clicks = [];
    const logEl = document.getElementById('log');

    canvas.addEventListener('mousedown', function(e) {
      const rect = canvas.getBoundingClientRect();
      const xPx = e.clientX - rect.left;
      const yPx = e.clientY - rect.top;

      // Transform px to PDF pt
      const pt = viewport.convertToPdfPoint(xPx, yPx);
      // pdf.js uses bottom-left origin? No, convertToPdfPoint usually returns bottom-left origin for Y, but we need top-left Y for pdf-lib!
      // Actually, wait, PDF viewport Y is bottom-up in raw PDF, but PDF-lib Y is bottom-up too!
      // Wait! PDF-lib Y is bottom-up (0 is bottom).
      // Let's check how we draw.
      // "box.y" in our system is top-down (0 is top). 
      // Let's output both just in case.
      
      const pdfX = pt[0];
      const pdfY_bottomUp = pt[1];
      const pdfY_topDown = viewport.viewBox[3] - pt[1];

      clicks.push({ x: pdfX, y: pdfY_topDown });
      if (clicks.length === 2) {
        const x = Math.min(clicks[0].x, clicks[1].x);
        const y = Math.min(clicks[0].y, clicks[1].y);
        const w = Math.abs(clicks[1].x - clicks[0].x);
        const h = Math.abs(clicks[1].y - clicks[0].y);
        
        const box = `{ "x": ${x.toFixed(2)}, "y": ${y.toFixed(2)}, "w": ${w.toFixed(2)}, "h": ${h.toFixed(2)} }`;
        logEl.value += box + '\n';
        clicks = [];
      } else {
        logEl.value += `Click 1: (${pdfX.toFixed(2)}, ${pdfY_topDown.toFixed(2)})\n`;
      }
    });
  </script>
</body>
</html>
