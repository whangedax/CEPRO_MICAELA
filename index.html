<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy administrada dinámicamente en electron/main.cjs para vinculación estricta de puerto sin comodines -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('cetpro_theme_preference');
          var isDark = pref === 'dark' || ((!pref || pref === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2313594A'/><path d='M8 10h16M16 10v14M11 24h10M10 15l6-5 6 5' stroke='%23E6F4F1' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>CEPRO_MICAELA 2.0 — Sistema Académico Institucional</title>
  </head>
  <body class="bg-[#F6F8FA] dark:bg-[#0F1715] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
